<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glasgow Air Quality</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #e0f7fa, #e8f5e9);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 6px;
      color: #222;
    }

    .subtitle {
      font-size: 13px;
      color: #888;
      margin-bottom: 24px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 36px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 8px 30px rgba(0,0,0,0.1);
      text-align: center;
    }

    .rating-badge {
      display: inline-block;
      padding: 14px 36px;
      border-radius: 50px;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 14px;
      letter-spacing: 1px;
    }

    .Good      { background: #e6f4ea; color: #2d7a3a; border: 2px solid #a8d5b5; }
    .Moderate  { background: #fff8e1; color: #e65100; border: 2px solid #ffe082; }
    .Poor      { background: #fdecea; color: #c62828; border: 2px solid #ef9a9a; }
    .Very-Poor { background: #4a0000; color: #ffffff; border: 2px solid #b71c1c; }
    .loading   { background: #f0f0f0; color: #aaa; border: 2px solid #ddd; }

    .advice {
      font-size: 15px;
      color: #555;
      margin-bottom: 28px;
      line-height: 1.6;
    }

    .readings {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 24px;
    }

    .reading-box {
      background: #f9f9f9;
      border-radius: 12px;
      padding: 16px;
      border: 1px solid #eee;
      transition: transform 0.2s;
    }

    .reading-box:hover { transform: scale(1.03); }

    .reading-box .label { font-size: 12px; color: #999; margin-bottom: 6px; }
    .reading-box .value { font-size: 22px; font-weight: 700; color: #333; }
    .reading-box .unit  { font-size: 11px; color: #bbb; margin-top: 2px; }

    .updated {
      font-size: 12px;
      color: #bbb;
      margin-top: 8px;
    }

    .footer {
      margin-top: 20px;
      font-size: 12px;
      color: #aaa;
    }
  </style>
</head>
<body>

  <div class="card">
    <p class="subtitle">Glasgow, Scotland</p>
    <h1>🌿 Air Quality Today</h1>

    <div class="rating-badge loading" id="rating">Loading...</div>
    <p class="advice" id="advice">Fetching latest data...</p>

    <div class="readings">
      <div class="reading-box">
        <div class="label">NO2</div>
        <div class="value" id="no2">--</div>
        <div class="unit">µg/m³</div>
      </div>
      <div class="reading-box">
        <div class="label">PM2.5</div>
        <div class="value" id="pm25">--</div>
        <div class="unit">µg/m³</div>
      </div>
      <div class="reading-box">
        <div class="label">O3</div>
        <div class="value" id="o3">--</div>
        <div class="unit">µg/m³</div>
      </div>
      <div class="reading-box">
        <div class="label">PM10</div>
        <div class="value" id="pm10">--</div>
        <div class="unit">µg/m³</div>
      </div>
    </div>

    <p class="updated" id="updated">--</p>
  </div>

  <p class="footer">Data from Glasgow Townhead · Updated every 3 hours</p>

  <script>
    const API_URL = "https://gn7e5b9wo6.execute-api.us-east-1.amazonaws.com/air-quality";

    async function loadAirQuality() {
      try {
        const response = await fetch(API_URL);
        const data     = await response.json();

        // API Gateway sometimes wraps data in a body string — handle both cases
        const air = typeof data.body === "string" ? JSON.parse(data.body) : data;

        // Update the rating badge
        const badge     = document.getElementById("rating");
        badge.textContent = air.rating;
        badge.className   = "rating-badge " + air.rating.replace(" ", "-");

        // Update advice and individual pollutant readings
        document.getElementById("advice").textContent  = air.advice;
        document.getElementById("no2").textContent     = air.readings.NO2;
        document.getElementById("pm25").textContent    = air.readings["PM2.5"];
        document.getElementById("o3").textContent      = air.readings.O3;
        document.getElementById("pm10").textContent    = air.readings.PM10;
        document.getElementById("updated").textContent = "Last updated: " + air.fetchedAt;

      } catch (error) {
        document.getElementById("rating").textContent = "Unavailable";
        document.getElementById("advice").textContent = "Could not load air quality data. Please try again later.";
        console.error("Failed to load air quality data:", error);
      }
    }

    loadAirQuality();
  </script>

</body>
</html>
